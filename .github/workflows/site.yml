name: Build site

on:
  push:
    branches: [main, migration/fumadocs]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**']
  workflow_dispatch:

# Pushes made with GITHUB_TOKEN do not trigger workflow runs (GitHub prevents
# recursion by design), so the commit step below cannot loop. The default token
# permission is read-only, though, so the write scope must be requested.
permissions:
  contents: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: npm ci

      # Resolve titles/favicons for any newly added resource links and rewrite
      # the cards. Incremental: only URLs missing from link-meta.json are
      # fetched. Never fails the build -- a flaky third-party host must not
      # break the site, cards just fall back to the bare domain.
      - name: Enrich resource links
        run: npm run links || echo "link enrichment failed; continuing with cached metadata"

      - run: npm run build

      # If enrichment found anything new, keep the cache in the repo so future
      # builds stay offline and deterministic.
      - name: Commit refreshed link metadata
        if: github.event_name == 'push'
        run: |
          cd ..
          if ! git diff --quiet -- site/link-meta.json site/public/assets/favicons site/content; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add site/link-meta.json site/public/assets/favicons site/content
            git commit -m "chore(site): refresh resource-link metadata [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/out
          retention-days: 7

  # Publish the static export to the VPS (served by nginx at
  # https://infiltr8.io/redbook/, alongside the GitBook at red.infiltr8.io).
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Full history so the IndexNow step can diff the pages changed in the push.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      # `rsync --delete` keeps /var/www/redbook an exact mirror of the build;
      # that path serves ONLY the Red-Book, so nothing else is ever removed.
      # The key comes from a secret (a string) but `ssh -i` needs a file, so it
      # is written out and locked down before use.
      - name: Deploy to VPS
        run: |
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > deploy_key
          chmod 600 deploy_key
          rsync -az --delete -e "ssh -i deploy_key -o StrictHostKeyChecking=accept-new" \
            out/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/redbook/"

      # Notify IndexNow (Bing, Yandex, DuckDuckGo, ...) of the pages changed in
      # this push, so they re-index in minutes. The key is public (also served at
      # /<key>.txt), so it is fine in the workflow. Never fails the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: 9cf2e2694d7c4dfe81283ebb957116af
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 .github/scripts/indexnow.py
